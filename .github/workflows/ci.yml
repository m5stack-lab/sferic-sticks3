name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-
      - run: pip install --upgrade platformio
      - run: pio test -e native
      - name: webui_html.h matches web/ sources
        run: |
          python scripts/gen_webui.py
          git diff --exit-code src/webui_html.h

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [sferic, sferic-usbhid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install --upgrade platformio
      - run: pio run -e ${{ matrix.env }}
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}-firmware
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Stage release assets
        run: |
          mkdir -p out
          cp dist/sferic-firmware/firmware.bin        "out/sferic-${{ github.ref_name }}.bin"
          cp dist/sferic-usbhid-firmware/firmware.bin  "out/sferic-usbhid-${{ github.ref_name }}.bin"
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
          generate_release_notes: true
          fail_on_unmatched_files: false
