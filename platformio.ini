; M5Stack sferic — StickS3 hardware/radio multitool. Arduino + M5Unified.

[firmware_base]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
extra_scripts =
    pre:scripts/git_rev.py
    pre:scripts/gen_webui.py
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -std=gnu++17
lib_deps =
    m5stack/M5Unified@^0.2.21
    h2zero/NimBLE-Arduino@^2.5.1
    crankyoldgit/IRremoteESP8266@^2.8.6
    kosme/arduinoFFT@^2.0.4
    bblanchon/ArduinoJson@^7.2.0

; Default build — hardware USB-Serial/JTAG (reliable flashing). No USB HID.
[env:sferic]
extends = firmware_base
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; USB-HID variant (ADR-0005): TinyUSB composite CDC+HID so usb.* tools work.
; Flashing may need a manual bootloader entry (hold the side button on connect).
[env:sferic-usbhid]
extends = firmware_base
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFERIC_USB_HID

; RF Pack S3 variant (ADR-0012): adds the subghz.* (CC1101) + nrf24.*
; (nRF24L01+) toolsets on the shared HAT2 SPI bus. Same USB mode as [sferic].
[env:sferic-rfpack]
extends = firmware_base
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFERIC_RF_PACK

; Networked station (ADR-0009 / milestone 3): opens a persistent WebSocket to
; the Pi collector and speaks the same op vocabulary as the serial link.
; Needs src/ws_config.h (copy ws_config.h.example — gitignored).
[env:sferic-ws]
extends = firmware_base
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFERIC_WS
lib_deps =
    ${firmware_base.lib_deps}
    links2004/WebSockets@^2.7.3

; Host unit tests for the hardware-independent logic. `pio test -e native`.
; Builds only the dependency-free sources it needs, never the M5/Arduino code.
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = yes
build_src_filter = +<toolset_label.cpp>
