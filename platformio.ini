; M5Stack sferic — StickS3 hardware/radio multitool. Arduino + M5Unified.

[firmware_base]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
extra_scripts = pre:scripts/git_rev.py
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -std=gnu++17
lib_deps =
    m5stack/M5Unified@^0.2.21
    h2zero/NimBLE-Arduino@^2.5.1
    crankyoldgit/IRremoteESP8266@^2.8.6
    kosme/arduinoFFT@^2.0.4

; Default build — hardware USB-Serial/JTAG (reliable flashing). No USB HID.
[env:sferic]
extends = firmware_base
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; USB-HID variant (ADR-0005): TinyUSB composite CDC+HID so usb.* tools work.
; Flashing may need a manual bootloader entry (hold the side button on connect).
[env:sferic-usbhid]
extends = firmware_base
build_flags =
    ${firmware_base.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSFERIC_USB_HID
